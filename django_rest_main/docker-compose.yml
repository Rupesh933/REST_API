version: '3.8'

services:
  web:
    build: .
    container_name: restapi
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=True
      - POSTGRES_DB=django_rest_main
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=qwerty
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - django_rest_main_net

  postgres:
    image: postgres:15
    container_name: restapi_db
    environment:
      - POSTGRES_DB=django_rest_main
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=qwerty
    ports:
      - "5433:5432"
    networks:
      - django_rest_main_net
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d django_rest_main" ]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: restapi_pgadmin
    ports:
      - "5050:80"
    networks:
      - django_rest_main_net
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  django_rest_main_net:
